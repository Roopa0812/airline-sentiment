apiVersion: apps/v1
kind: Deployment
metadata:
  name: airline-sentiment
  labels:
    app: airline-sentiment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: airline-sentiment
  template:
    metadata:
      labels:
        app: airline-sentiment
    spec:
      containers:
        - name: airline-sentiment
          image: YOUR_DOCKERHUB_USERNAME/airline-sentiment:latest
          ports:
            - containerPort: 8501
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: airline-sentiment-service
spec:
  selector:
    app: airline-sentiment
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
  type: LoadBalancer
